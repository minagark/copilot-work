<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.lineicons.com/4.0/lineicons.css">
  <style>
    .link-bar { background: blue; color: white; }
    .header-bar { background: #f0653c; }
    .aside-1 { background: gold; }
    .main-content { background: #4cc3f7; }
    .aside-2 { background: #f06cc0; }
    .footer-bar { background: #9be89b; }
    .link-bar a { color: #fff; text-decoration: none; }
    .link-bar a:hover { text-decoration: underline; }

    /* Only make main taller on medium+ screens; allow asides to stretch when side-by-side
       When stacked (mobile), asides won't be artificially tall. */
    @media (min-width: 768px) {
      .content-row { align-items: stretch; }
      .content-row .main-content { min-height: 60vh; }
    }

    .rps-container { display: flex; flex-direction: column; gap: 1.5rem; }
    .rps-score { font-size: 1.3rem; }
    .rps-choices { display: flex; justify-content: space-around; gap: 1rem; }
    .rps-choice { text-align: center; }
    .rps-choice-icon { font-size: 3rem; }
    .rps-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .rps-result { font-size: 1.5rem; font-weight: bold; text-align: center; }
    .rps-countdown { font-size: 2rem; text-align: center; font-weight: bold; color: #c62828; min-height: 2.5rem; }
  </style>
</head>
<body>
  <nav class="text-center fw-bold py-2 link-bar">
    <div class="d-flex justify-content-center align-items-center gap-4">
      <a href="/copilot-work/ceos-mn-index.html"><i class="lni lni-home"></i> Home</a>
      <a href="/copilot-work/ceos-mn-rps.html"><i class="lni lni-gamepad"></i> RPS vs Bot</a>
      <a href="/copilot-work/ceos-mn-rps_multi.html"><i class="lni lni-gamepad"></i> RPS Multiplayer</a>
    </div>
  </nav>

  <header class="text-center fw-bold py-2 header-bar"><i class="lni lni-menu"></i> Header</header>

  <div class="row g-0 content-row">
    <aside class="col-md-2 text-center fw-bold py-3 aside-1"><i class="lni lni-sidebar"></i> Aside 1</aside>
    <main class="col-md-8 p-4 main-content d-flex align-items-center justify-content-center">
      <div class="rps-container w-100">
        <h2 class="text-center">Rock Paper Scissors</h2>
        <div class="rps-score">
          <span>You: <span id="playerScore">0</span></span> | 
          <span>Computer: <span id="computerScore">0</span></span>
        </div>

        <div class="rps-countdown" id="countdown"></div>

        <div class="rps-choices">
          <div class="rps-choice">
            <div>You</div>
            <div class="rps-choice-icon" id="playerIcon">-</div>
            <div id="playerChoice">-</div>
          </div>
          <div class="rps-choice">
            <div class="rps-result" id="result"></div>
          </div>
          <div class="rps-choice">
            <div>Computer</div>
            <div class="rps-choice-icon" id="computerIcon">-</div>
            <div id="computerChoice">-</div>
          </div>
        </div>

        <div class="rps-buttons">
          <button class="btn btn-warning" onclick="playGame('rock')">
            <i class="lni lni-shield"></i> Rock
          </button>
          <button class="btn btn-info" onclick="playGame('paper')">
            <i class="lni lni-layers"></i> Paper
          </button>
          <button class="btn btn-danger" onclick="playGame('scissors')">
            <i class="lni lni-cut"></i> Scissors
          </button>
        </div>
      </div>
    </main>
    <aside class="col-md-2 text-center fw-bold py-3 aside-2"><i class="lni lni-sidebar-1"></i> Aside 2</aside>
  </div>

  <footer class="text-center fw-bold py-2 footer-bar"><i class="lni lni-footer"></i> Footer</footer>

  <script>
    let playerScore = 0, computerScore = 0;
    let gameInProgress = false;

    const icons = { rock: 'lni-shield', paper: 'lni-layers', scissors: 'lni-cut' };
    const choices = ['rock', 'paper', 'scissors'];

    function getComputerChoice() {
      return choices[Math.floor(Math.random() * 3)];
    }

    function determineWinner(player, computer) {
      if (player === computer) return 'tie';
      if ((player === 'rock' && computer === 'scissors') ||
          (player === 'paper' && computer === 'rock') ||
          (player === 'scissors' && computer === 'paper')) return 'win';
      return 'lose';
    }

    function updateScore(result) {
      if (result === 'win') playerScore++;
      else if (result === 'lose') computerScore++;
      document.getElementById('playerScore').textContent = playerScore;
      document.getElementById('computerScore').textContent = computerScore;
    }

    function displayResult(player, computer, result) {
      document.getElementById('playerIcon').innerHTML = `<i class="lni ${icons[player]}"></i>`;
      document.getElementById('computerIcon').innerHTML = `<i class="lni ${icons[computer]}"></i>`;
      document.getElementById('playerChoice').textContent = player;
      document.getElementById('computerChoice').textContent = computer;
      
      const resultText = result === 'tie' ? 'TIE' : result === 'win' ? 'YOU WIN!' : 'YOU LOSE!';
      const resultColor = result === 'win' ? 'text-success' : result === 'lose' ? 'text-danger' : 'text-warning';
      document.getElementById('result').textContent = resultText;
      document.getElementById('result').className = 'rps-result ' + resultColor;

      updateScore(result);
    }

    function playGame(playerChoice) {
      if (gameInProgress) return;
      gameInProgress = true;
      document.getElementById('countdown').textContent = '3';

      let countdown = 3;
      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) document.getElementById('countdown').textContent = countdown;
        else {
          clearInterval(timer);
          const computerChoice = getComputerChoice();
          const result = determineWinner(playerChoice, computerChoice);
          displayResult(playerChoice, computerChoice, result);
          document.getElementById('countdown').textContent = '';
          gameInProgress = false;
        }
      }, 1000);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key.toUpperCase() === 'R') playGame('rock');
      else if (e.key.toUpperCase() === 'P') playGame('paper');
      else if (e.key.toUpperCase() === 'S') playGame('scissors');
    });
  </script>
</body>
</html>
