<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors - Multiplayer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.lineicons.com/4.0/lineicons.css">
  <style>
    .link-bar { background: blue; color: white; }
    .header-bar { background: #f0653c; }
    .aside-1 { background: gold; }
    .main-content { background: #4cc3f7; }
    .aside-2 { background: #f06cc0; }
    .footer-bar { background: #9be89b; }
    .link-bar a { color: #fff; text-decoration: none; }
    .link-bar a:hover { text-decoration: underline; }

    @media (min-width: 768px) {
      .content-row { align-items: stretch; }
      .content-row .main-content { min-height: 60vh; }
    }

    .rps-container { display: flex; flex-direction: column; gap: 1.5rem; }
    .rps-score { font-size: 1.3rem; text-align: center; }
    .rps-choices { display: flex; justify-content: space-around; gap: 1rem; }
    .rps-choice { text-align: center; flex: 1; }
    .rps-choice-icon { font-size: 3rem; min-height: 3.5rem; }
    .rps-result { font-size: 1.5rem; font-weight: bold; text-align: center; min-height: 2rem; }
    .rps-countdown { font-size: 2rem; text-align: center; font-weight: bold; color: #c62828; min-height: 2.5rem; }
    .rps-status { font-size: 1.1rem; text-align: center; min-height: 2.5rem; }
    .rps-status-text { font-size: 0.95rem; color: #666; }
  </style>
</head>
<body>
  <nav class="text-center fw-bold py-2 link-bar">
    <div class="d-flex justify-content-center align-items-center gap-4">
      <a href="/index.html"><i class="lni lni-home"></i> Home</a>
      <a href="/rps.html"><i class="lni lni-gamepad"></i> RPS vs Bot</a>
      <a href="/rps_multi.html"><i class="lni lni-gamepad"></i> RPS Multiplayer</a>
    </div>
  </nav>

  <header class="text-center fw-bold py-2 header-bar"><i class="lni lni-menu"></i> Header</header>

  <div class="row g-0 content-row">
    <aside class="col-md-2 text-center fw-bold py-3 aside-1"><i class="lni lni-sidebar"></i> Aside 1</aside>
    <main class="col-md-8 p-4 main-content d-flex align-items-center justify-content-center">
      <div class="rps-container w-100">
        <h2 class="text-center">Rock Paper Scissors - Two Player</h2>
        <div class="rps-score">
          <span>Player 1: <span id="player1Score">0</span></span> | 
          <span>Player 2: <span id="player2Score">0</span></span>
        </div>

        <div class="rps-countdown" id="countdown"></div>

        <div class="rps-status">
          <div id="statusText" class="rps-status-text"></div>
        </div>

        <div class="rps-choices">
          <div class="rps-choice">
            <div><strong>Player 1</strong></div>
            <div class="rps-choice-icon" id="player1Icon">-</div>
            <div id="player1Choice">-</div>
          </div>
          <div class="rps-choice">
            <div class="rps-result" id="result"></div>
          </div>
          <div class="rps-choice">
            <div><strong>Player 2</strong></div>
            <div class="rps-choice-icon" id="player2Icon">-</div>
            <div id="player2Choice">-</div>
          </div>
        </div>

        <div class="rps-buttons">
          <button class="btn btn-success btn-lg" id="playBtn" onclick="startRound()">
            <i class="lni lni-play"></i> Play Round
          </button>
        </div>
      </div>
    </main>
    <aside class="col-md-2 text-center fw-bold py-3 aside-2"><i class="lni lni-sidebar-1"></i> Aside 2</aside>
  </div>

  <footer class="text-center fw-bold py-2 footer-bar"><i class="lni lni-footer"></i> Footer</footer>

  <script>
    let player1Score = 0, player2Score = 0;
    let gameInProgress = false;
    let player1Choice = null, player2Choice = null;

    const icons = { rock: 'lni-shield', paper: 'lni-layers', scissors: 'lni-cut' };
    const choiceMap = { 'q': 'rock', 'a': 'paper', 'z': 'scissors' };
    const choiceMap2 = { 'p': 'rock', 'l': 'paper', ',': 'scissors' };

    function startRound() {
      if (gameInProgress) return;
      gameInProgress = true;
      player1Choice = null;
      player2Choice = null;

      document.getElementById('playBtn').disabled = true;
      document.getElementById('statusText').textContent = 'Player 1: Press Q/A/Z | Player 2: Press P/L/,';
      document.getElementById('player1Icon').textContent = '-';
      document.getElementById('player2Icon').textContent = '-';
      document.getElementById('player1Choice').textContent = '-';
      document.getElementById('player2Choice').textContent = '-';
      document.getElementById('result').textContent = '';

      let timeLeft = 5;
      document.getElementById('countdown').textContent = timeLeft;

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          document.getElementById('countdown').textContent = timeLeft;
        } else {
          clearInterval(timer);
          endRound();
        }
      }, 1000);
    }

    function endRound() {
      document.getElementById('countdown').textContent = '';
      document.getElementById('playBtn').disabled = false;

      // Default to rock if no choice made
      player1Choice = player1Choice || 'rock';
      player2Choice = player2Choice || 'rock';

      // Display choices
      document.getElementById('player1Icon').innerHTML = `<i class="lni ${icons[player1Choice]}"></i>`;
      document.getElementById('player2Icon').innerHTML = `<i class="lni ${icons[player2Choice]}"></i>`;
      document.getElementById('player1Choice').textContent = player1Choice;
      document.getElementById('player2Choice').textContent = player2Choice;

      // Determine winner
      const result = determineWinner(player1Choice, player2Choice);
      displayResult(result);

      gameInProgress = false;
    }

    function determineWinner(p1, p2) {
      if (p1 === p2) return 'tie';
      if ((p1 === 'rock' && p2 === 'scissors') ||
          (p1 === 'paper' && p2 === 'rock') ||
          (p1 === 'scissors' && p2 === 'paper')) return 'p1';
      return 'p2';
    }

    function displayResult(result) {
      let resultText, resultColor;
      if (result === 'tie') {
        resultText = 'TIE';
        resultColor = 'text-warning';
      } else if (result === 'p1') {
        resultText = 'P1 WINS!';
        resultColor = 'text-success';
        player1Score++;
      } else {
        resultText = 'P2 WINS!';
        resultColor = 'text-info';
        player2Score++;
      }

      document.getElementById('player1Score').textContent = player1Score;
      document.getElementById('player2Score').textContent = player2Score;
      document.getElementById('result').textContent = resultText;
      document.getElementById('result').className = 'rps-result ' + resultColor;
      document.getElementById('statusText').textContent = '';
    }

    document.addEventListener('keydown', (e) => {
      if (!gameInProgress) return;

      const key = e.key.toLowerCase();
      
      // Player 1: R/P/S
      if (key === 'q' || key === 'a' || key === 'z') {
        if (!player1Choice) {
          player1Choice = choiceMap[key];
          document.getElementById('statusText').textContent = 'Player 1: Ready! ✓ | Player 2: Press P/L/,';
        }
      }
      
      // Player 2: 1/2/3
      if (key === 'p' || key === 'l' || key === ',') {
        if (!player2Choice) {
          player2Choice = choiceMap2[key];
          document.getElementById('statusText').textContent = 'Player 1: Ready! ✓ | Player 2: Ready! ✓';
        }
      }
    });
  </script>
</body>
</html>
